sonar.projectKey=thargosu_leman.el
sonar.organization=thargosu

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=leman.el
#sonar.projectVersion=1.0

# The Rust E2EE agent is the analyzed code base (there is no elisp
# analyzer; see e2ee/PROTOCOL.org for the agent's design).
sonar.sources=e2ee/agent/src
sonar.tests=e2ee/agent/tests
sonar.rust.cargo.manifestPaths=e2ee/agent/Cargo.toml

# Coverage report produced by `cargo llvm-cov --cobertura`.
sonar.coverage.cobertura.xmlReportPaths=e2ee/agent/cobertura.xml

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
