name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Test, lint, audit, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # The agent is sensible crypto code: gate every change on tests
      # with coverage, clippy, and a RustSec advisory audit, then
      # publish all three to SonarCloud.
      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview clippy
          cargo install cargo-llvm-cov --locked

      - name: Test with coverage
        working-directory: e2ee/agent
        run: cargo llvm-cov --cobertura --output-path cobertura.xml

      - name: Lint
        working-directory: e2ee/agent
        run: cargo clippy --all-targets -- -D warnings

      - name: Security audit (RustSec)
        working-directory: e2ee/agent
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
